workflows:
  probar-mac:
    name: Probar Mac M2 para nxnative
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: "27.2"

    scripts:
      - name: Instalar y verificar Metal
        script: |
          set -e
          export DEVELOPER_DIR="/Applications/Xcode-27.2.app/Contents/Developer"
          xcodebuild -version

          if ! xcrun --no-cache --sdk iphoneos metal --version; then
            metal_dir="$(mktemp -d)"
            xcodebuild -downloadComponent metalToolchain -exportPath "$metal_dir"

            bundle="$(find "$metal_dir" -name '*.exportedBundle' -print -quit)"
            if [ -n "$bundle" ]; then
              xcodebuild -importComponent metalToolchain -importPath "$bundle"
            else
              dmg="$(find "$metal_dir" -name '*.dmg' -print -quit)"
              if [ -z "$dmg" ]; then
                echo "Xcode no dejó un archivo de Metal para importar." >&2
                exit 1
              fi
              xcodebuild -importComponent metalToolchain "$dmg"
            fi
          fi

          xcrun --no-cache --sdk iphoneos metal --version
          xcrun --no-cache --sdk macosx metal --version
