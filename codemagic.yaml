workflows:
  probar-mac:
    name: Probar Mac M2 para nxnative
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: "27.2"

    scripts:
      - name: Montar y verificar Metal
        script: |
          set -euo pipefail
          export DEVELOPER_DIR="/Applications/Xcode-27.2.app/Contents/Developer"

          if ! xcrun --no-cache --sdk iphoneos metal --version; then
            download_log="$(mktemp)"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$download_log"

            if ! xcrun --no-cache --sdk iphoneos metal --version; then
              dmg="$(sed -n 's/^Downloaded asset to: //p' "$download_log" | tail -n 1)"
              if [ ! -f "$dmg" ]; then
                echo "Xcode no indicó una ruta válida al DMG de Metal." >&2
                exit 1
              fi

              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi

          xcrun --no-cache --sdk iphoneos metal --version
          xcrun --no-cache --sdk macosx metal --version
